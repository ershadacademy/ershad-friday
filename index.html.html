<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ERSHAD FRIDAY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap">
<style>
/* Layout: brand-blue hero (logo top-right, huge title, yellow rule, ghosted figures) -> yellow ticker band ->
   five colour-block cards in a 3+2 grid over a faint crescent pattern. The loud moment is the click:
   an explosion of the logo's eccentric rings, then a blue reveal panel with a white coupon. */
:root {
  --blue: #18488C;
  --yellow: #F9B418;
  --green: #1C6F38;
  --blue-hi: #18488C;
  --green-hi: #1C6F38;
  --on-yellow: #12305C;
  --bg: #F3F6FB;
  --surface: #FFFFFF;
  --tint: #E6ECF6;
  --ink: #12305C;
  --ink-soft: #506385;
  --line: #DCE3EF;
  --scrim: rgba(7, 20, 45, .62);
  --shadow: 0 1px 0 rgba(18, 48, 92, .04), 0 14px 30px -16px rgba(18, 48, 92, .32);
  --shadow-up: 0 2px 0 rgba(18, 48, 92, .04), 0 26px 44px -18px rgba(18, 48, 92, .45);
  --d-l: block;
  --d-d: none;
  --f-ar: 'Alexandria', 'Segoe UI', Tahoma, sans-serif;
  --f-en: 'Poppins', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue-hi: #7FA3E0; --green-hi: #43A767;
    --bg: #07142B; --surface: #0E2243; --tint: #16294F; --ink: #EEF3FB; --ink-soft: #A4B3D0; --line: #1D3560;
    --scrim: rgba(2, 8, 20, .76);
    --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 16px 30px -16px rgba(0, 0, 0, .7);
    --shadow-up: 0 2px 0 rgba(0, 0, 0, .25), 0 28px 46px -18px rgba(0, 0, 0, .85);
    --d-l: none; --d-d: block;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --blue-hi: #7FA3E0; --green-hi: #43A767;
  --bg: #07142B; --surface: #0E2243; --tint: #16294F; --ink: #EEF3FB; --ink-soft: #A4B3D0; --line: #1D3560;
  --scrim: rgba(2, 8, 20, .76);
  --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 16px 30px -16px rgba(0, 0, 0, .7);
  --shadow-up: 0 2px 0 rgba(0, 0, 0, .25), 0 28px 46px -18px rgba(0, 0, 0, .85);
  --d-l: none; --d-d: block;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.6 var(--f-ar);
  padding-block: 16px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1080px; margin-inline: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.en { font-family: var(--f-en); direction: ltr; unicode-bidi: isolate; }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; isolation: isolate; border-radius: 24px; background: var(--blue); color: #fff; }
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -2;
  background:
    radial-gradient(110% 90% at 88% -10%, rgba(255, 255, 255, .16), transparent 55%),
    radial-gradient(90% 80% at 0% 110%, rgba(0, 0, 0, .22), transparent 60%);
}
.hero-figs { position: absolute; z-index: -1; left: -4%; bottom: -10%; height: 118%; width: auto; max-width: none; opacity: .1; pointer-events: none; user-select: none; }
.hero-in { position: relative; padding: clamp(20px, 4vw, 40px); display: grid; gap: clamp(36px, 8vw, 96px); }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero-logo { display: block; height: clamp(48px, 9vw, 78px); width: auto; }
.pill { font: 600 .78rem/1 var(--f-en); letter-spacing: .18em; color: var(--yellow); border: 1.5px solid rgba(249, 180, 24, .75); padding: 9px 14px; border-radius: 99px; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.hero-body { display: grid; gap: 14px; justify-items: start; }
.eyebrow { margin: 0; color: var(--yellow); font: 600 clamp(.95rem, 2.6vw, 1.15rem)/1.3 var(--f-ar); }
h1 { margin: 0; font: 800 clamp(2.5rem, 12.5vw, 8.4rem)/.92 var(--f-en); letter-spacing: -.02em; text-transform: uppercase; direction: ltr; unicode-bidi: isolate; text-align: start; }
h1 span { display: block; }
h1 .f2 { color: var(--yellow); }
.sub { margin: 4px 0 0; font: 600 clamp(.72rem, 2.7vw, 1.05rem)/1 var(--f-en); letter-spacing: .36em; direction: ltr; unicode-bidi: isolate; color: #fff; }
.rule { width: 100%; height: 3px; background: var(--yellow); margin-top: 8px; }
.lead { margin: 0; max-width: 46ch; color: rgba(255, 255, 255, .88); font-size: clamp(1rem, 2.6vw, 1.12rem); }
.badge { position: absolute; left: clamp(14px, 6vw, 70px); top: clamp(104px, 20vw, 210px); width: clamp(74px, 21vw, 188px); transform: rotate(-9deg); filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .25)); }
.badge svg { display: block; width: 100%; height: auto; overflow: visible; }

/* ---------- ticker ---------- */
.band { margin-top: 14px; background: var(--yellow); color: var(--on-yellow); border-radius: 14px; overflow: hidden; direction: ltr; }
.track { display: flex; width: max-content; animation: run 34s linear infinite; }
.set { display: flex; align-items: center; gap: 22px; padding: 13px 11px; white-space: nowrap; font: 700 .86rem/1 var(--f-en); letter-spacing: .2em; }
.set svg { width: 15px; height: 15px; fill: currentColor; flex: none; }
@keyframes run { to { transform: translateX(-50%); } }

/* ---------- cards ---------- */
.stage { position: relative; isolation: isolate; margin-top: clamp(28px, 6vw, 56px); }
.patbg { position: absolute; z-index: -1; left: -16px; right: -16px; top: -10px; height: 72%; width: calc(100% + 32px); opacity: .1; pointer-events: none; -webkit-mask-image: linear-gradient(#000 20%, transparent); mask-image: linear-gradient(#000 20%, transparent); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.sec-head h2 { margin: 0; font: 800 clamp(1.6rem, 5vw, 2.3rem)/1.2 var(--f-ar); }
.sec-head p { margin: 0; font: 600 .76rem/1 var(--f-en); letter-spacing: .26em; color: var(--ink-soft); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr)); gap: 18px; }
.card {
  min-width: 0; padding: 0; overflow: hidden; display: flex; flex-direction: column;
  font: inherit; color: inherit; text-align: start; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  transition: transform .25s cubic-bezier(.2, .8, .3, 1), box-shadow .25s ease;
}
@media (hover: hover) { .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-up); } }
.card:focus-visible { outline: 3px solid var(--blue-hi); outline-offset: 4px; }
.card > span { display: block; min-width: 0; }
.c-art { position: relative; isolation: isolate; overflow: hidden; display: flex !important; flex-direction: column; justify-content: flex-end; gap: 6px; min-height: 200px; padding: 22px; background: var(--c); color: var(--on-c); }
.c-ring { position: absolute; z-index: -1; fill: var(--on-c); opacity: .15; transition: transform .6s cubic-bezier(.2, .8, .3, 1); }
.c-ring.r1 { width: 230px; height: 230px; left: -52px; top: -78px; }
.c-ring.r2 { width: 112px; height: 112px; left: 150px; top: 14px; }
@media (hover: hover) {
  .card:hover .r1 { transform: translate(8px, 10px) rotate(14deg); }
  .card:hover .r2 { transform: translate(-6px, 8px) rotate(-18deg); }
}
.c-icon { position: absolute; top: 20px; inset-inline-start: 20px; width: 48px; height: 48px; border-radius: 14px; border: 1.5px solid color-mix(in srgb, var(--on-c) 45%, transparent); display: grid !important; place-items: center; }
.c-icon svg { width: 25px; height: 25px; fill: none; stroke: var(--on-c); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.c-chip { position: absolute; top: 24px; inset-inline-end: 22px; font: 800 .8rem/1 var(--f-en); letter-spacing: .1em; padding: 7px 10px; border-radius: 8px; background: var(--on-c); color: var(--c); direction: ltr; unicode-bidi: isolate; }
.c-tag { font: 600 .7rem/1.2 var(--f-en); letter-spacing: .22em; text-transform: uppercase; opacity: .86; direction: ltr; unicode-bidi: isolate; text-align: start; }
.c-name { font: 700 clamp(1.35rem, 3.4vw, 1.7rem)/1.25 var(--f-ar); padding-inline-end: 56px; }
.c-go { position: absolute; bottom: 20px; inset-inline-end: 20px; width: 44px; height: 44px; border-radius: 50%; background: var(--on-c); color: var(--c); display: grid !important; place-items: center; transition: transform .3s cubic-bezier(.2, 1.4, .4, 1); }
@media (hover: hover) { .card:hover .c-go { transform: scale(1.12) rotate(14deg); } }
.c-go svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.c-go .ic-check { display: none; }
.card.is-open .c-go .ic-check { display: block; }
.card.is-open .c-go .ic-burst { display: none; }
.c-foot { display: flex !important; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 18px; }
.c-lab { font: 500 .84rem/1.2 var(--f-ar); color: var(--ink-soft); }
.c-ticket { display: flex !important; align-items: center; justify-content: center; min-height: 40px; padding: 6px 12px; border: 1.5px dashed var(--line); border-radius: 10px; font: 700 1rem/1 var(--f-en); letter-spacing: .16em; direction: ltr; unicode-bidi: isolate; }
.c-mask { color: var(--ink-soft); }
.c-code { display: none !important; color: var(--ink); }
.card.is-open .c-mask { display: none !important; }
.card.is-open .c-code { display: block !important; }
.card.is-open .c-ticket { border-style: solid; border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
.card.boom { animation: boom .5s ease; }
@keyframes boom { 0% { transform: scale(1); } 35% { transform: scale(1.06); } 100% { transform: scale(1); } }
.grid.shake { animation: shake .42s linear; }
@keyframes shake {
  10% { transform: translate(-7px, 3px); } 25% { transform: translate(7px, -4px); } 40% { transform: translate(-5px, -3px); }
  55% { transform: translate(5px, 4px); } 70% { transform: translate(-3px, 2px); } 85% { transform: translate(2px, -2px); } 100% { transform: none; }
}

/* ---------- footer ---------- */
.foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; color: var(--ink-soft); font-size: .9rem; }
.foot img { height: 40px; width: auto; }
.foot .l { display: var(--d-l); }
.foot .d { display: var(--d-d); }
.foot a { color: var(--blue-hi); font-family: var(--f-en); direction: ltr; unicode-bidi: isolate; }

/* ---------- explosion ---------- */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }

/* ---------- reveal panel ---------- */
.pop {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--scrim);
  padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  opacity: 0; transition: opacity .25s ease; overscroll-behavior: contain;
}
.pop.show { opacity: 1; }
.panel {
  position: relative; isolation: isolate; overflow: hidden; width: min(100%, 440px);
  background: var(--blue); color: #fff; border-radius: 22px; border: 1px solid rgba(255, 255, 255, .14);
  box-shadow: 0 34px 90px -20px rgba(0, 0, 0, .6);
  opacity: 0; transform: scale(.72) translateY(26px);
  transition: transform .6s cubic-bezier(.2, 1.35, .4, 1), opacity .25s ease;
}
.pop.in .panel { opacity: 1; transform: none; }
.panel::before {
  content: ""; position: absolute; inset: -60%; z-index: -2;
  background: repeating-conic-gradient(from 0deg at 50% 42%, rgba(249, 180, 24, .2) 0 6deg, transparent 6deg 12deg);
  -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0, transparent 46%);
  mask-image: radial-gradient(circle at 50% 42%, #000 0, transparent 46%);
  animation: spin 50s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.p-ring { position: absolute; z-index: -1; fill: #fff; opacity: .08; pointer-events: none; }
.p-ring.a { width: 220px; height: 220px; left: -70px; bottom: -80px; }
.p-ring.b { width: 110px; height: 110px; right: -26px; top: 150px; }
.x { position: absolute; z-index: 3; top: 12px; inset-inline-end: 12px; width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, .12); color: #fff; cursor: pointer; display: grid; place-items: center; }
.x:hover { background: rgba(255, 255, 255, .22); }
.x svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; fill: none; }
.p-scroll { position: relative; display: grid; gap: 14px; justify-items: center; text-align: center; padding: 26px 22px 22px; max-height: calc(100vh - 28px); max-height: calc(100dvh - 28px); overflow-y: auto; }
.p-logo { display: block; height: 46px; width: auto; }
.p-kicker { margin: 4px 0 0; color: rgba(255, 255, 255, .78); font: 500 .98rem/1.2 var(--f-ar); }
.p-sec { margin-top: -6px; padding: 7px 16px; border-radius: 99px; background: var(--c, var(--yellow)); color: var(--on-c, var(--on-yellow)); font: 700 1.05rem/1.3 var(--f-ar); box-shadow: 0 0 0 2px rgba(255, 255, 255, .5); }
.p-big { display: flex; align-items: baseline; justify-content: center; gap: 4px; direction: ltr; color: var(--yellow); font: 800 clamp(5.4rem, 25vw, 8rem)/.9 var(--f-en); letter-spacing: -.03em; font-variant-numeric: tabular-nums; text-shadow: 0 8px 30px rgba(249, 180, 24, .35); }
.p-big small { font-size: .46em; letter-spacing: 0; }
.p-off { margin: -4px 0 4px; color: rgba(255, 255, 255, .8); font: 500 .95rem/1.3 var(--f-ar); }
.coupon { position: relative; width: 100%; background: #fff; color: var(--blue); border-radius: 16px; padding: 14px 16px 16px; display: grid; gap: 4px; overflow: hidden; }
.coupon::before, .coupon::after { content: ""; position: absolute; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; background: var(--blue); }
.coupon::before { left: -11px; }
.coupon::after { right: -11px; }
.cp-lab { font: 600 .78rem/1.2 var(--f-ar); color: #506385; }
.coupon code { display: block; font: 800 clamp(1.8rem, 8.5vw, 2.5rem)/1.1 var(--f-en); letter-spacing: .12em; direction: ltr; unicode-bidi: isolate; user-select: all; -webkit-user-select: all; color: var(--blue); }
.btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 54px; padding: 12px 16px; border-radius: 14px; font: 700 1.05rem/1.2 var(--f-ar); text-decoration: none; cursor: pointer; transition: transform .15s ease, background .2s ease; }
.btn:active { transform: scale(.98); }
.btn:focus-visible, .x:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
.btn-copy { border: 0; background: var(--yellow); color: var(--on-yellow); box-shadow: 0 10px 24px -10px rgba(249, 180, 24, .8); }
.btn-copy:hover { background: #ffc43d; }
.btn-go { border: 1.5px solid rgba(255, 255, 255, .45); background: transparent; color: #fff; }
.btn-go:hover { background: rgba(255, 255, 255, .12); }
.btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

@media (max-width: 560px) {
  .grid { gap: 14px; }
  .c-art { min-height: 170px; padding: 18px; }
  .c-ring.r2 { left: 120px; }
  .hero { border-radius: 20px; }
  .badge { top: 96px; }
}
@media (max-width: 380px) {
  .c-name { font-size: 1.25rem; }
  .pill { font-size: .7rem; padding: 8px 11px; }
  .p-scroll { padding: 24px 16px 18px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .p-logo { height: 34px; }
  .p-big { font-size: 4.2rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .badge { animation: bob 3.4s ease-in-out infinite; }
}
@keyframes bob { 50% { transform: rotate(-4deg) scale(1.06); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <mask id="pm" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <circle cx="36" cy="24" r="17" fill="#000"/>
      <circle cx="88" cy="32" r="11" fill="#000"/>
      <circle cx="90" cy="86" r="17" fill="#000"/>
      <circle cx="34" cy="88" r="11" fill="#000"/>
    </mask>
    <pattern id="pat" width="120" height="120" patternUnits="userSpaceOnUse">
      <g mask="url(#pm)">
        <circle cx="30" cy="30" r="22" fill="var(--blue-hi)"/>
        <circle cx="84" cy="36" r="15" fill="var(--yellow)"/>
        <circle cx="84" cy="92" r="22" fill="var(--blue-hi)"/>
        <circle cx="30" cy="92" r="15" fill="var(--yellow)"/>
      </g>
    </pattern>

</svg>

  var $ = function (id) { return document.getElementById(id); };

  /* explosion canvas */
  var cv = $('fx'), cx = cv.getContext('2d');
  var W = 0, H = 0, parts = [], rings = [], flash = null, raf = 0, last = 0, TAU = 6.2832;

  window.addEventListener('resize', size);
  function tok(n, fb) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb; }

    }
    rings = rings.filter(function (o) {
      o.r += o.v * dt; o.v *= Math.pow(.95, dt); o.life -= .022 * dt;
      if (o.life <= 0) return false;
      cx.globalAlpha = o.life; cx.strokeStyle = o.c; cx.lineWidth = Math.max(o.w * o.life, .5);
      cx.beginPath(); cx.arc(o.x, o.y, o.r, 0, TAU); cx.stroke();
      return true;
    });
    parts = parts.filter(function (p) {
      p.vx *= Math.pow(p.drag, dt); p.vy = p.vy * Math.pow(p.drag, dt) + p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
      if (p.life <= 0) return false;
      cx.globalAlpha = Math.min(1, p.life * 1.5);
      if (p.t === 's') {
        cx.strokeStyle = p.c; cx.lineWidth = p.w; cx.lineCap = 'round';
        cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.vx * 1.6, p.y - p.vy * 1.6); cx.stroke();
      } else {
        /* the logo's eccentric ring: a circle with an off-centre hole */
        var R = p.w, ox = R * .16, oy = -R * .12, ir = R * .74;
        p.r += p.vr * dt;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
        cx.beginPath(); cx.arc(0, 0, R, 0, TAU); cx.moveTo(ox + ir, oy); cx.arc(ox, oy, ir, 0, TAU); cx.fill('evenodd');
        cx.restore();
      }
      return true;
    });
    cx.globalAlpha = 1;
    if (parts.length || rings.length || flash) { raf = requestAnimationFrame(tick); }
    else { raf = 0; cx.clearRect(0, 0, W, H); }
  }

  /* panel */
  var pop = $('pop'), pCopy = $('pCopy'), pClose = $('pClose'), pGo = $('pGo'), pCode = $('pCode');
  var cur = 0, lastFocus = null, busy = false, hideT = 0, copyT = 0, panelT = 0;

  function countTo(el, to, ms) {
    if (RM.matches) { el.textContent = to; return; }
    var t0 = performance.now();
    (function f(t) {
      var p = Math.min((t - t0) / ms, 1);
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(f);
    })(t0);
  }
  function decode(el, fin, ms) {
    if (RM.matches) { el.textContent = fin; return; }
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789', t0 = performance.now();
    (function f(t) {
      var p = Math.min((t - t0) / ms, 1), lock = Math.floor(p * fin.length), s = '', i;
      if (p >= 1) { el.textContent = fin; return; }
      for (i = 0; i < fin.length; i++) s += i < lock ? fin.charAt(i) : chars.charAt(Math.floor(Math.random() * chars.length));
      el.textContent = s;
      requestAnimationFrame(f);
    })(t0);
  }
  function resetCopy() {
    clearTimeout(copyT);
    $('pCopyLabel').textContent = 'نسخ الكود';
    $('pStatus').textContent = '';
  }
  function prepPanel(i) {
    var d = DATA[i];
    cur = i;
    var sec = $('pSec');
    sec.textContent = d.ar;
    sec.style.setProperty('--c', d.col.cv);
    sec.style.setProperty('--on-c', d.col.on);
    pCode.textContent = new Array(d.code.length + 1).join('•');
    $('pNum').textContent = '0';
    pGo.href = d.url;
    resetCopy();
  }
  function showScrim() {
    clearTimeout(hideT);
    pop.hidden = false;
    requestAnimationFrame(function () { requestAnimationFrame(function () { pop.classList.add('show'); }); });
  }
  function showPanel() {
    var d = DATA[cur];
    pop.classList.add('in');
    countTo($('pNum'), 50, 700);
    decode(pCode, d.code, 800);
    var card = grid.children[cur];
    card.classList.add('is-open');
    setTimeout(function () { pCopy.focus({ preventScroll: true }); }, 80);
    busy = false;
  }
  function closePop() {
    if (!pop.classList.contains('in')) return;
    pop.classList.remove('in'); pop.classList.remove('show');
    clearTimeout(hideT);
    hideT = setTimeout(function () { pop.hidden = true; }, 300);
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }
  function onCard(i, el) {
    if (busy || !pop.hidden) return;
    busy = true; lastFocus = el;
    prepPanel(i);
    if (RM.matches) { showScrim(); showPanel(); return; }
    var r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, DATA[i]);
    grid.classList.remove('shake'); void grid.offsetWidth; grid.classList.add('shake');
    el.classList.add('boom');
    setTimeout(function () { el.classList.remove('boom'); }, 520);
    showScrim();
    clearTimeout(panelT);
    panelT = setTimeout(showPanel, 440);
  }

  function legacyCopy(node) {
    try {
      var r = document.createRange(); r.selectNodeContents(node);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      return document.execCommand('copy');
    } catch (e) { return false; }
  }
  function showCopied(ok) {
    var msg = ok ? 'تم نسخ الكود' : 'الكود محدد، انسخه من لوحة المفاتيح';
    $('pCopyLabel').textContent = msg;
    $('pStatus').textContent = msg;
    clearTimeout(copyT);
    copyT = setTimeout(resetCopy, 2400);
  }
  pCopy.addEventListener('click', async function () {
    var ok = false;
    pCode.textContent = DATA[cur].code;
    try { await navigator.clipboard.writeText(DATA[cur].code); ok = true; }
    catch (e) { ok = legacyCopy(pCode); }
    showCopied(ok);
  });
  pClose.addEventListener('click', closePop);
  pop.addEventListener('click', function (e) { if (e.target === pop) closePop(); });
  document.addEventListener('keydown', function (e) {
    if (pop.hidden || !pop.classList.contains('in')) return;
    if (e.key === 'Escape') { closePop(); return; }
    if (e.key === 'Tab') {
      var f = [pClose, pCopy, pGo], idx = f.indexOf(document.activeElement);
      e.preventDefault();
      idx = e.shiftKey ? (idx <= 0 ? f.length - 1 : idx - 1) : (idx + 1) % f.length;
      f[idx].focus();
    }
  });
})();
</script>
